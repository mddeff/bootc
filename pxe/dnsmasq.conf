# dnsmasq: DHCP + TFTP for PXE-booting bootc kickstart installs.
# Serves BOTH firmware types (verified on libvirt/OVMF and SeaBIOS+iPXE):
#   - UEFI clients  -> grubx64.efi over TFTP -> grub.cfg -> kernel/initrd over TFTP
#   - BIOS clients with an iPXE NIC ROM (qemu virtio) -> HTTP iPXE script, no TFTP needed
#
# EDIT: interface, dhcp-range/router, tftp-root, and the HTTP server IP (here 10.20.0.1).
# port=0 disables DNS so this can coexist with a resolver already on :53 (e.g. libvirt's).

interface=virbr1
bind-interfaces
except-interface=lo
port=0

dhcp-range=10.20.0.100,10.20.0.150,12h
dhcp-option=option:router,10.20.0.1
dhcp-option=option:dns-server,10.20.0.1
dhcp-authoritative
dhcp-leasefile=/srv/bootc-pxe/dnsmasq.leases

enable-tftp
tftp-root=/srv/bootc-pxe/tftp

# iPXE user-class (option 175) -> hand it the HTTP script
dhcp-match=set:ipxe,175
# UEFI HTTP Boot (client-arch 16, vendor class HTTPClient) -> grub over HTTP, no TFTP at all.
# The option-60 echo is mandatory: firmware ignores the offer without it.
dhcp-vendorclass=set:httpboot,HTTPClient
dhcp-option-force=tag:httpboot,60,HTTPClient
dhcp-boot=tag:httpboot,"http://10.20.0.1:8000/grubx64.efi"
# UEFI PXE (client-arch 7) -> grub over TFTP (fallback for firmware without HTTP boot)
dhcp-match=set:efi64,option:client-arch,7
dhcp-boot=tag:ipxe,http://10.20.0.1:8000/boot.ipxe
dhcp-boot=tag:!ipxe,tag:!httpboot,tag:efi64,grubx64.efi

log-dhcp
