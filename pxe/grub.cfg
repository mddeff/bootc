# grub.cfg — served over TFTP next to grubx64.efi (grub looks for it at the TFTP root).
# EDIT the HTTP server IP and pick your default entry.
set timeout=5

menuentry 'c9s-base: kickstart install (CentOS Stream 9)' {
  linux vmlinuz9 inst.stage2=http://10.20.0.1:8000/stream9 inst.ks=http://10.20.0.1:8000/ks/c9s-base.ks ip=dhcp inst.text console=ttyS0,115200
  initrd initrd9.img
}

menuentry 'c10s-base: kickstart install (CentOS Stream 10)' {
  linux vmlinuz10 inst.stage2=http://10.20.0.1:8000/stream10 inst.ks=http://10.20.0.1:8000/ks/c10s-base.ks ip=dhcp inst.text console=ttyS0,115200
  initrd initrd10.img
}
